[project]
name = "bemine"
version = "0.1.0"
description = "Personal multi-device agent mayor."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "discord.py==2.7.1",
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.scripts]
bemine = "bemine.cli:main"
bemine-daemon = "bemine.jobs.daemon:main"
bemine-discord-gateway = "bemine.discord.gateway:main"
bemine-discord-send = "bemine.discord.send:main"
mayor-discord-gateway = "bemine.discord.gateway:main"
mayor-discord-send = "bemine.discord.send:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bemine"]
