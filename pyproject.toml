[project]
name = "bemine"
version = "0.1.0"
description = "Personal multi-device agent mayor."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "discord.py==2.7.1",
]

[project.scripts]
bemine = "bemine.cli:main"
bemine-daemon = "bemine.daemon:main"
bemine-discord-gateway = "mayor_discord.gateway:main"
bemine-discord-send = "mayor_discord.send:main"
mayor-discord-gateway = "mayor_discord.gateway:main"
mayor-discord-send = "mayor_discord.send:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bemine", "src/mayor_discord"]
