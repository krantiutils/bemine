# Bemine configuration — human-facing knobs.
#
# Secrets never live here (they stay in env vars / credential stores); this file
# only names which env var holds each secret and sets the active defaults.
#
# Quick start: the two knobs you'll touch most are:
#   [dispatch].runtime      — which agent answers Discord messages by default
#   [agent].max_output_tokens — how long replies can be
# Everything else has a sane default.

[identity]
device_id = "cdjk"

[paths]
state_dir = ".bemine"                 # Bemine's local SQLite state + runtime files
vault_dir = "~/Documents/Mayor"       # Obsidian memory vault
codex_home = "~/.codex"
claude_home = "~/.claude"
kimi_home = "~/devlog/raw/kimi"
hermes_home = "~/.hermes"

[status]
# Devices Bemine checks for agent sessions. "local" is this machine; the rest are
# SSH-reachable hosts. Trim this to the devices you actually use.
devices = ["local", "mbp", "mbp2", "k2"]

[projects]
ignored_roots = ["~/gt"]              # repos under these paths are never indexed

[context]
# Files injected (redacted) into dispatched-agent prompts.
operator_files = ["~/deploy.md"]
harness_files = ["/home/cdjk/bm/SOUL.md", "/home/cdjk/bm/SKILL.md", "/home/cdjk/bm/USER.md"]

# ----------------------------------------------------------------------------
# Which agent answers a Discord message.
# ----------------------------------------------------------------------------
[dispatch]
# Default runtime for messages that aren't in a project channel (DMs, home, etc.).
# Project channels can override this per-channel.
#   kimi   — fast, self-contained (uses your Kimi key). Good general default.
#   claude — highest-quality chat; uses your Claude Max plan via the Meridian
#            proxy (needs the `meridian` service running on 127.0.0.1:3456).
#   codex  — full coding agent on your ChatGPT plan; edits files / runs commands
#            in the channel's project dir. Best reserved for coding channels.
runtime = "kimi"

# ----------------------------------------------------------------------------
# Agent loop behavior (applies to kimi + claude, which run Bemine's own loop).
# ----------------------------------------------------------------------------
[agent]
max_output_tokens = 4096              # max length of a single reply
max_tool_iterations = 16             # tool-step budget per message (it still answers at the limit)
harness_context_limit = 24000        # max chars of SOUL/SKILL/USER injected into context

# ----------------------------------------------------------------------------
# Per-runtime settings. Subscriptions/keys are used — no pay-per-token API keys.
# ----------------------------------------------------------------------------
[kimi]
# The live Discord path talks to Kimi's Anthropic-compatible API directly.
model = "kimi-k2.6"
base_url = "https://api.kimi.com/coding"
api_mode = "anthropic_messages"
provider = "kimi-coding"
bin = "/home/cdjk/.local/bin/kimi"   # only used by the legacy kimi-CLI path
backend = "cli"                       # legacy CLI knob; live path ignores it

[codex]
# Codex runs via its app-server using your ChatGPT (Codex) plan — no API key.
# (The Discord agent always uses the app-server; no backend knob needed here.)
model = ""                            # empty = use Codex's own configured model
# Sandbox for codex actions in a channel's project dir:
#   read-only        — safest; codex can read but not change files
#   workspace-write  — codex may edit files / run commands within the project dir
#   danger-full-access — no sandbox (not recommended)
sandbox = "workspace-write"
bin = ""                              # empty = find `codex` on PATH

[claude]
# Claude runs through the Meridian proxy, which bridges your Claude Max plan to
# an Anthropic-compatible endpoint. Start it with: systemctl --user start meridian
backend = "meridian"
model = "claude-sonnet-4-6"
base_url = "http://127.0.0.1:3456"
api_key_env = "MERIDIAN_API_KEY"      # Meridian accepts any value by default

[discord]
token_env = "MAYOR_DISCORD_BOT_TOKEN"
home_channel_id = ""
# DM this Discord user id with session-watcher updates (empty = post to home channel).
notify_user_id = "681542219488166101"
guild_id = ""
# Access control. allow_all_users = false is the safe default: only the user IDs
# listed here (or in MAYOR_DISCORD_ALLOWED_USERS) may talk to the bot.
allowed_users = []
allow_all_users = false
context_messages = 12                 # prior messages included as context

[jobs]
# Session watcher: a session idle longer than this (and not asking) is "done working".
# Lower = snappier "done" pings, but more chance of pinging during a long pause.
session_idle_seconds = 180
# Only watch sessions whose last activity is within this window (ignore stale ones,
# e.g. sessions last active days ago). 7200 = 2 hours.
session_recent_seconds = 7200
# Auto-create a project channel when a session's project has none (updates always go to
# a channel, never a DM).
session_auto_create_channels = true
# Catch-all channel for sessions that aren't a real project (created if missing).
session_fallback_channel = "session-updates"

[policy]
# How much the Discord agent's shell_run tool can do:
#   project-write — (safe default) commands run only inside the channel's project dir
#   unrestricted  — full machine: any command, any dir, install software, call any API
#                   (the agent inherits the gateway env, incl. $MAYOR_DISCORD_BOT_TOKEN)
#   disabled      — no shell at all
# "unrestricted" gives the agent broad power; only use it if you trust everyone in
# [discord].allowed_users, since they can make it run arbitrary commands.
shell = "unrestricted"
allow_external_paths = true           # let file_read/file_search reach outside the project

[security]
totp_secret_env = "BEMINE_TOTP_SECRET"
